project:
  type: website
  output-dir: _site
  render:
    - "**/*.qmd"
    - "!casos.qmd"   # fora do ar até haver casos reais publicáveis
    - "!dataviz/**"  # seção em construção; também fora do git (ver .gitignore)
  # Art referenced only from a `style` attribute is invisible to Quarto's
  # resource discovery, so the directory is declared explicitly.
  resources:
    # `reference/` guarda os originais de trabalho e fica fora da publicação.
    - static/images/art/*.webp
    - static/images/art/finished/
    - static/images/art/hokusai-series-2026-09/*.webp
    # Fallback card for a post that ships without its own figure. Referenced
    # only from post front matter, so Quarto cannot discover it either.
    - static/images/insight-placeholder.svg
    - robots.txt

website:
  title: "EKIO"
  description: "Consultoria em Economia e Dados"
  site-url: "https://ekio.io"
  favicon: static/images/brand/monogram-navy.svg
  image: /static/images/og-card.png
  open-graph: true
  twitter-card: true
  # TODO: criar propriedade GA4 em analytics.google.com e inserir o ID G-XXXXXXX
  # google-analytics: "G-XXXXXXX"

  # Navigation — horizontal lockup at left, uppercase links right
  navbar:
    pinned: true
    logo: static/images/brand/lockup-navy.svg
    logo-alt: "EKIO"
    logo-href: index.qmd
    # custom.scss overrides this with $paper; the value here only paints the
    # bar before the stylesheet loads. Keep it equal to $paper.
    background: "#F9F8F3"
    foreground: "#373A3D"
    title: false
    search: false
    collapse-below: lg
    right:
      - text: "Serviços"
        href: servicos.qmd
      - text: "Sobre"
        href: sobre.qmd
      - text: "Insights"
        href: insights/index.qmd
      - text: "Contato"
        href: contato.qmd

  # Footer
  page-footer:
    # custom.scss paints the footer with $ink; this is the pre-stylesheet
    # value only.
    background: "#191A1C"
    foreground: "#AEB1B5"
    left: |
      <img class="footer-mark" src="/static/images/brand/banner-light.svg" alt="EKIO">
      <span class="footer-brand">Consultoria em Economia e Dados</span>
    right:
      - text: "Serviços"
        href: servicos.qmd
      - text: "Sobre"
        href: sobre.qmd
      - text: "Insights"
        href: insights/index.qmd
      - text: "Contato"
        href: contato.qmd
      - text: "LinkedIn"
        href: "https://linkedin.com/in/viniciusoike"

  # Sidebar (disabled for main pages)
  sidebar: false

  # Page navigation (prev/next — disabled for main pages)
  page-navigation: false

lang: pt

# O _language-pt.yml do Quarto traz "Alternar de navegação", que não é
# português corrente. O botão só aparece no menu recolhido do celular.
language:
  toggle-navigation: "Abrir menu de navegação"

filters:
  - static/filters/post-cover.lua

# Format
format:
  html:
    theme:
      - cosmo
      - static/css/custom.scss
    css: static/css/pages.css
    include-in-header: static/head.html
    toc: false
    page-layout: full
    # Marketing pages drive their own headers; posts re-enable this in
    # insights/posts/_metadata.yml.
    title-block-style: none
    # Flat headings — section wrappers break the grid/flex layouts below.
    section-divs: false
    anchor-sections: false
    grid:
      sidebar-width: 0px
      body-width: 1440px
      margin-width: 0px
    # O site publica texto e imagens. O código que gera as figuras fica no
    # GitHub, não na página: sem botão "Código", sem blocos dobráveis e sem
    # o modal com o fonte do .qmd.
    code-tools: false
    code-fold: false
    code-link: false
    # O Netlify serve /servicos e /servicos.html para a mesma página. O
    # canonical aponta a versão que vale; depende do site-url acima.
    canonical-url: true

# Execute
execute:
  freeze: auto
  echo: false
  warning: false
  message: false
