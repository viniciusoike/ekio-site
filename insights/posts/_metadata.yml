# Shared defaults for every post in insights/posts/ (Quarto cascades this file).
# New posts only need: title, date, description, categories, image.
# (execute echo/warning/message = false is already set globally in _quarto.yml.)

# Layout
page-layout: article
toc: true
toc-location: right
title-block-style: default
art-cover: true
section-divs: true
anchor-sections: true
grid:
  body-width: 760px
  margin-width: 200px
  sidebar-width: 0px

# Authoring defaults
author: "Vinicius Oike Reginatto"
# The site defaults to plain math (_quarto.yml); posts with formulas need
# MathJax enabled.
html-math-method: mathjax
freeze: true   # posts are static once published; override per-post if needed

# Figures
# Device, dpi and default size live in _ekio-style.R, which every post sources.
# dev = "ragg_png" and out.width have no document-level equivalent here, so
# keeping half the rules in this file would only invite drift.
