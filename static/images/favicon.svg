<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- EK monogram — interlocking E and K -->
  <rect width="64" height="64" rx="8" fill="#1E3A5F"/>

  <!-- E letterform -->
  <path d="M16 16 L16 48 L32 48" stroke="white" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <line x1="16" y1="32" x2="28" y2="32" stroke="white" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="16" y1="16" x2="32" y2="16" stroke="white" stroke-width="3.5" stroke-linecap="round"/>

  <!-- K letterform — shares vertical with E -->
  <line x1="32" y1="16" x2="32" y2="48" stroke="white" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="32" y1="32" x2="48" y2="16" stroke="white" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="32" y1="32" x2="48" y2="48" stroke="white" stroke-width="3.5" stroke-linecap="round"/>
</svg>
