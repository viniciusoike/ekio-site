<!-- Raster marks for surfaces that cannot take the SVG favicon. Both come from
     ekio-monogram-navy; the cream ring survives at 16px only because these are
     rasterized at the source. -->
<link rel="icon" type="image/png" sizes="16x16" href="/static/images/brand/favicon-16.png">
<link rel="icon" type="image/png" sizes="32x32" href="/static/images/brand/favicon-32.png">
<link rel="icon" type="image/png" sizes="48x48" href="/static/images/brand/favicon-48.png">
<link rel="apple-touch-icon" sizes="180x180" href="/static/images/brand/apple-touch-icon-180.png">

<!-- Tipografia. O preconnect abre a conexão com o servidor de fontes enquanto
     o CSS ainda está sendo baixado; o stylesheet vem logo em seguida para que
     o navegador descubra as fontes sem esperar a folha compilada do tema.
     As famílias e os pesos precisam bater com $font-* em static/css/custom.scss. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Host+Grotesk:wght@400;500;600;700&family=Lato:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap">
